[project]
name = "llm-gateway"
version = "0.1.0"
description = "OpenAI-compatible gateway that routes each prompt to the cheapest model that can answer it well."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "openai>=1.50",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "redis>=5.0",
    "fastembed>=0.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "matplotlib>=3.9",
    "datasets>=2.20",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "openinference-instrumentation-openai>=0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "fakeredis>=2.24",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: needs Postgres/Redis (TEST_DATABASE_URL / TEST_REDIS_URL)",
    "slow: downloads or runs the embedding model",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
